[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.5.0"
description = "Document text extraction (digital / OCR / VLM / auto) and LLM field extraction (get_fields)"
requires-python = ">=3.10"
dependencies = [
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "pillow>=10",
  "numpy",
  "litellm>=1.50",
  "rapidocr>=3.0",
  "onnxruntime>=1.17",  # rapidocr does not declare a runtime backend itself
  "duckdb>=1.0",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pytest>=8"
]

[project.optional-dependencies]
dev = ["reportlab>=4", "httpx>=0.27"]  # reportlab builds test PDFs; httpx is the web tests' client

[project.scripts]
docintel-web = "docintel.web.__main__:main"

[tool.setuptools.package-data]
"docintel.web" = ["templates/*.html", "static/*"]

[tool.setuptools.packages.find]
include = ["docintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
