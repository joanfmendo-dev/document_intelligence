{% extends "base.html" %}
{% block title %}Sign in · DocBase{% endblock %}
{% block nav %}<nav class="bar"><span class="logo">DocBase</span></nav>{% endblock %}
{% block content %}
<form class="login" method="post" action="/login">
<h1>Sign in</h1>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<input type="hidden" name="next" value="{{ next }}">
<p><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></p>
<p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></p>
<button class="btn pri" type="submit">Sign in</button>
</form>
{% endblock %}
