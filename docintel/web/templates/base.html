<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DocBase{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<nav class="bar"><span class="logo">DocBase</span><a href="/upload"{% if active == 'upload' %} class="on" aria-current="page"{% endif %}>Upload document</a><a href="/records"{% if active == 'records' %} class="on" aria-current="page"{% endif %}>Database</a></nav>
<main class="wrap{% block wide %}{% endblock %}"{% block main_attrs %}{% endblock %}>
{% if flash %}<p class="ok" role="status">{{ flash }}</p>{% endif %}
{% block content %}{% endblock %}
</main>
{% block after %}{% endblock %}
<script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
